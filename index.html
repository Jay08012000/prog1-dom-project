<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter student name">

        <label for="grade1">Grade 1:</label>
        <input type="number" id="grade1" placeholder="Enter grade">

        <label for="grade2">Grade 2:</label>
        <input type="number" id="grade2" placeholder="Enter grade">

        <label for="grade3">Grade 3:</label>
        <input type="number" id="grade3" placeholder="Enter grade">

        <div class="buttons">
            <button id="calculateBtn">Calculate</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div id="result">
            Result will appear here.
        </div>

    </div>

    <div class="full-name">
        Jay-Ar B. Espinosa
    </div>


    <script src="script.js"></script>

</body>
</html>
